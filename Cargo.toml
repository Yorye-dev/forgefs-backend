[package]
name = "forgefs-backend"
version = "0.1.0"
edition = "2024"

[dependencies]
console_log = { version = "0.2", features = ["color"] }
tokio = { version = "1", features = ["full"] }
axum = {version = "0.8.4",  features = ["multipart"]}
tower = "0.5.2"
tracing = "0.1"
tracing-subscriber = "0.3.19"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
dotenv = "0.15.0"
reqwest = "0.12.22"
